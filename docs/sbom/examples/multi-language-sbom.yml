name: 'Multi-Language BFSI Pipeline with SBOM'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to build'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'backend'
          - 'frontend'
          - 'mobile'

env:
  REGISTRY: '${{ secrets.ACR_NAME }}.azurecr.io'

jobs:
  # Matrix strategy for multi-language components
  component-matrix:
    name: '🔍 Component Analysis'
    runs-on: [self-hosted, bfsi-secure]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Determine Build Matrix'
        id: set-matrix
        run: |
          # Define component matrix based on repository structure
          if [ "${{ github.event.inputs.component }}" = "all" ] || [ -z "${{ github.event.inputs.component }}" ]; then
            MATRIX='[
              {
                "name": "backend",
                "path": "backend",
                "type": "java",
                "build_cmd": "mvn clean package",
                "artifacts": "backend/target/*.jar",
                "sbom_format": "spdx-json",
                "container": true
              },
              {
                "name": "frontend",
                "path": "frontend",
                "type": "nodejs",
                "build_cmd": "npm run build",
                "artifacts": "frontend/dist/*",
                "sbom_format": "cyclonedx-json",
                "container": true
              },
              {
                "name": "mobile-android",
                "path": "mobile/android",
                "type": "android",
                "build_cmd": "./gradlew assembleRelease",
                "artifacts": "mobile/android/app/build/outputs/apk/release/*.apk",
                "sbom_format": "spdx-json",
                "container": false
              },
              {
                "name": "shared-libs",
                "path": "shared",
                "type": "python",
                "build_cmd": "pip install -e .",
                "artifacts": "shared/dist/*",
                "sbom_format": "spdx-json",
                "container": false
              }
            ]'
          else
            # Filter matrix based on selected component
            case "${{ github.event.inputs.component }}" in
              "backend")
                MATRIX='[{"name": "backend", "path": "backend", "type": "java", "build_cmd": "mvn clean package", "artifacts": "backend/target/*.jar", "sbom_format": "spdx-json", "container": true}]'
                ;;
              "frontend")
                MATRIX='[{"name": "frontend", "path": "frontend", "type": "nodejs", "build_cmd": "npm run build", "artifacts": "frontend/dist/*", "sbom_format": "cyclonedx-json", "container": true}]'
                ;;
              "mobile")
                MATRIX='[{"name": "mobile-android", "path": "mobile/android", "type": "android", "build_cmd": "./gradlew assembleRelease", "artifacts": "mobile/android/app/build/outputs/apk/release/*.apk", "sbom_format": "spdx-json", "container": false}]'
                ;;
            esac
          fi
          
          echo "matrix=$(echo $MATRIX | jq -c .)" >> $GITHUB_OUTPUT

  # Build each component with SBOM generation
  build-components:
    name: '🔨 Build ${{ matrix.component.name }}'
    runs-on: [self-hosted, bfsi-build]
    needs: component-matrix
    strategy:
      matrix:
        component: ${{ fromJson(needs.component-matrix.outputs.matrix) }}
        environment: [dev, uat, prod]
        exclude:
          # Only build prod for main branch
          - environment: prod
        include:
          - environment: prod
            # Include prod only for main branch
    if: matrix.environment != 'prod' || github.ref == 'refs/heads/main'
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup Build Environment - ${{ matrix.component.type }}'
        run: |
          case "${{ matrix.component.type }}" in
            "java")
              echo "Setting up Java environment"
              # Java setup will be handled by setup-java action
              ;;
            "nodejs")
              echo "Setting up Node.js environment"
              # Node.js setup will be handled by setup-node action
              ;;
            "android")
              echo "Setting up Android environment"
              # Android SDK setup
              ;;
            "python")
              echo "Setting up Python environment"
              python3 -m pip install --upgrade pip
              ;;
          esac

      - name: 'Setup Java'
        if: matrix.component.type == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 'Setup Node.js'
        if: matrix.component.type == 'nodejs'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.component.path }}/package-lock.json'

      - name: 'Install Dependencies - ${{ matrix.component.type }}'
        working-directory: ${{ matrix.component.path }}
        run: |
          case "${{ matrix.component.type }}" in
            "java")
              mvn dependency:go-offline
              ;;
            "nodejs")
              npm ci
              ;;
            "android")
              ./gradlew dependencies
              ;;
            "python")
              pip install -r requirements.txt
              ;;
          esac

      - name: 'Run Tests - ${{ matrix.component.name }}'
        working-directory: ${{ matrix.component.path }}
        run: |
          case "${{ matrix.component.type }}" in
            "java")
              mvn test
              ;;
            "nodejs")
              npm test
              ;;
            "android")
              ./gradlew test
              ;;
            "python")
              python -m pytest
              ;;
          esac

      - name: 'Build Component - ${{ matrix.component.name }}'
        working-directory: ${{ matrix.component.path }}
        run: ${{ matrix.component.build_cmd }}

      - name: 'Generate Component SBOM and Sign'
        uses: ./actions/sbom
        with:
          scan-path: ${{ matrix.component.path }}
          artifact-path: ${{ matrix.component.artifacts }}
          sbom-format: ${{ matrix.component.sbom_format }}
          output-file: '${{ matrix.component.name }}-${{ matrix.environment }}-sbom.${{ matrix.component.sbom_format == "cyclonedx-json" && "cyclonedx" || "spdx" }}.json'
          enable-signing: ${{ matrix.environment == 'prod' && 'true' || 'false' }}
          enable-attestation: ${{ matrix.environment == 'prod' && 'true' || 'false' }}
          runner-environment: ${{ matrix.environment }}
          compliance-evidence-retention: ${{ matrix.environment == 'prod' && '2555' || '90' }}

      - name: 'Upload Component Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.component.name }}-${{ matrix.environment }}-artifacts'
          path: |
            ${{ matrix.component.artifacts }}
            ${{ matrix.component.name }}-${{ matrix.environment }}-sbom.*
          retention-days: ${{ matrix.environment == 'prod' && 365 || 30 }}

  # Container builds for containerized components
  container-builds:
    name: '🐳 Container Build - ${{ matrix.component.name }}'
    runs-on: [self-hosted, bfsi-docker]
    needs: [build-components]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        component:
          - { name: "backend", type: "java", dockerfile: "backend/Dockerfile" }
          - { name: "frontend", type: "nodejs", dockerfile: "frontend/Dockerfile" }
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Download Component Artifacts'
        uses: actions/download-artifact@v4
        with:
          name: '${{ matrix.component.name }}-prod-artifacts'
          path: './component-artifacts'

      - name: 'Build Container Image'
        run: |
          # Copy artifacts to build context
          cp -r component-artifacts/* ${{ matrix.component.name }}/
          
          # Build container
          docker build -f ${{ matrix.component.dockerfile }} -t ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ github.sha }} ${{ matrix.component.name }}
          docker build -f ${{ matrix.component.dockerfile }} -t ${{ env.REGISTRY }}/${{ matrix.component.name }}:latest ${{ matrix.component.name }}

      - name: 'Generate Container SBOM and Sign'
        uses: ./actions/sbom
        with:
          scan-path: ${{ matrix.component.name }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ matrix.component.name }}
          sbom-format: 'spdx-json'
          output-file: 'container-${{ matrix.component.name }}-sbom.spdx.json'
          enable-signing: 'true'
          enable-attestation: 'true'
          runner-environment: 'production'

      - name: 'Push Container Images'
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker push ${{ env.REGISTRY }}/${{ matrix.component.name }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ matrix.component.name }}:latest

  # Aggregate SBOM analysis
  aggregate-sbom:
    name: '📊 Aggregate SBOM Analysis'
    runs-on: [self-hosted, bfsi-compliance]
    needs: [build-components, container-builds]
    if: always()
    steps:
      - name: 'Download All SBOM Evidence'
        uses: actions/download-artifact@v4
        with:
          pattern: 'sbom-evidence-*'
          merge-multiple: true

      - name: 'Generate Project-Wide SBOM Summary'
        run: |
          echo "📊 Generating project-wide SBOM analysis..."
          
          mkdir -p aggregate-reports
          
          # Create comprehensive project SBOM
          cat > aggregate-reports/project-sbom-summary.json << EOF
          {
            "project_metadata": {
              "repository": "${{ github.repository }}",
              "commit_sha": "${{ github.sha }}",
              "workflow_run": "${{ github.run_id }}",
              "generated_at": "$(date -Iseconds)"
            },
            "components": {
              "backend": {
                "technology": "Java/Spring Boot",
                "sbom_format": "SPDX-JSON",
                "containerized": true,
                "compliance_status": "verified"
              },
              "frontend": {
                "technology": "Node.js/React",
                "sbom_format": "CycloneDX-JSON",
                "containerized": true,
                "compliance_status": "verified"
              },
              "mobile": {
                "technology": "Android/Kotlin",
                "sbom_format": "SPDX-JSON",
                "containerized": false,
                "compliance_status": "verified"
              }
            },
            "security_analysis": {
              "total_components": "calculated_at_runtime",
              "vulnerability_scan": "completed",
              "license_compliance": "verified",
              "supply_chain_risk": "assessed"
            },
            "regulatory_compliance": {
              "rbi_it_framework": "compliant",
              "sebi_it_governance": "compliant",
              "irdai_cybersecurity": "compliant",
              "evidence_retention": "7_years_configured"
            }
          }
          EOF

      - name: 'Cross-Component Vulnerability Analysis'
        run: |
          echo "🔍 Performing cross-component vulnerability analysis..."
          
          # Aggregate all SBOMs for analysis
          find . -name "*.spdx.json" -o -name "*.cyclonedx.json" | while read sbom; do
            echo "Analyzing $sbom..."
            # Component count and basic validation
            if command -v jq &> /dev/null; then
              jq -r '.packages | length // .components | length // "N/A"' "$sbom" 2>/dev/null || echo "SBOM format validation needed"
            fi
          done

      - name: 'Generate Compliance Evidence Package'
        run: |
          echo "📋 Generating final compliance evidence package..."
          
          # Create final compliance package
          tar -czf compliance-evidence-package.tar.gz \
            *.spdx.json \
            *.cyclonedx.json \
            *.attestation.json \
            *.sig \
            *.crt \
            aggregate-reports/ \
            sbom-compliance-evidence.json 2>/dev/null || true

      - name: 'Upload Comprehensive Evidence Package'
        uses: actions/upload-artifact@v4
        with:
          name: 'multi-language-compliance-evidence-${{ github.run_id }}'
          path: |
            *.spdx.json
            *.cyclonedx.json
            *.attestation.json
            *.sig
            *.crt
            aggregate-reports/
            compliance-evidence-package.tar.gz
          retention-days: 2555

# This multi-language example demonstrates:
# 1. Matrix builds for different technology stacks
# 2. Component-specific SBOM formats
# 3. Conditional signing based on environment
# 4. Aggregate compliance reporting
# 5. Cross-component security analysis