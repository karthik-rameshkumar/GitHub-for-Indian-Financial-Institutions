name: Spring Boot CI/CD for Financial Institutions

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository -Xmx1024m'

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build for CodeQL
      run: mvn clean compile -DskipTests

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run dependency scan
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: moderate
        allow-licenses: Apache-2.0, MIT, BSD-3-Clause

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [security-scan, dependency-scan]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests with coverage
      run: |
        mvn clean test jacoco:report
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: target/surefire-reports/*.xml
        reporter: java-junit

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella

    - name: Build application
      run: mvn clean package -DskipTests

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-jar
        path: target/*.jar
        retention-days: 30

  compliance-check:
    name: Compliance Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: RBI Compliance Check
      run: |
        echo "Checking RBI compliance requirements..."
        # Add custom compliance validation scripts here
        
    - name: IRDAI Guidelines Validation
      run: |
        echo "Validating IRDAI guidelines..."
        # Add IRDAI specific checks here

    - name: Data Protection Audit
      run: |
        echo "Auditing data protection measures..."
        # Add data protection validation scripts

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: spring-boot-jar
        path: target/

    - name: Build Docker image
      run: |
        docker build -t financial-app:${{ github.sha }} .

    - name: Microsoft Defender for Containers Scan
      run: |
        # Install Azure CLI
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        
        # Login to Azure
        az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
        
        # Push to ACR for scanning
        az acr login --name ${{ secrets.ACR_NAME }}
        docker tag financial-app:${{ github.sha }} ${{ secrets.ACR_NAME }}.azurecr.io/financial-app:${{ github.sha }}
        docker push ${{ secrets.ACR_NAME }}.azurecr.io/financial-app:${{ github.sha }}
        
        # Trigger security assessment
        az security assessment create \
          --name "container-vulnerability-assessment" \
          --status-code "Healthy" \
          --resource-id "/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ secrets.AZURE_RG }}/providers/Microsoft.ContainerRegistry/registries/${{ secrets.ACR_NAME }}" \
          --additional-data "{\"imageDigest\": \"${{ github.sha }}\", \"repository\": \"financial-app\"}"

    - name: Upload Defender scan results
      run: |
        # Download and convert results
        az security assessment list \
          --resource-group ${{ secrets.AZURE_RG }} \
          --query "[?name=='container-vulnerability-assessment']" \
          --output json > defender-results.json
          
        # Convert to SARIF (would need custom script)
        echo '{"version": "2.1.0", "runs": []}' > defender-results.sarif
        
      continue-on-error: true

    - name: Upload Defender Results to GitHub
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'defender-results.sarif'