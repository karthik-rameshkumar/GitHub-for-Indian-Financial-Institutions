name: 'BFSI SBOM Generation and Signing'
description: 'Generate Software Bill of Materials (SBOM) and sign artifacts for BFSI compliance'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  scan-path:
    description: 'Path to scan for SBOM generation'
    required: false
    default: '.'
  sbom-format:
    description: 'SBOM format (json, spdx-json, cyclonedx-json, table)'
    required: false
    default: 'spdx-json'
  output-file:
    description: 'Output file name for SBOM'
    required: false
    default: 'sbom.spdx.json'
  enable-signing:
    description: 'Enable artifact signing with cosign'
    required: false
    default: 'true'
  enable-attestation:
    description: 'Enable SLSA attestation generation'
    required: false
    default: 'true'
  artifact-path:
    description: 'Path to artifacts to sign (supports glob patterns)'
    required: false
    default: 'target/*.jar'
  registry:
    description: 'Container registry for image signing'
    required: false
    default: ''
  image-name:
    description: 'Container image name for signing'
    required: false
    default: ''
  compliance-evidence-retention:
    description: 'Evidence retention in days for regulatory compliance'
    required: false
    default: '2555'  # 7 years for BFSI compliance
  runner-environment:
    description: 'Runner environment (dev, uat, prod)'
    required: false
    default: 'dev'

outputs:
  sbom-file:
    description: 'Path to generated SBOM file'
    value: ${{ steps.generate-sbom.outputs.sbom-file }}
  signature-file:
    description: 'Path to signature file'
    value: ${{ steps.sign-artifacts.outputs.signature-file }}
  attestation-file:
    description: 'Path to SLSA attestation file'
    value: ${{ steps.generate-attestation.outputs.attestation-file }}
  compliance-report:
    description: 'Path to compliance evidence report'
    value: ${{ steps.compliance-evidence.outputs.report-file }}

runs:
  using: 'composite'
  steps:
    - name: 'Setup SBOM and Signing Tools'
      shell: bash
      run: |
        echo "🔧 Installing SBOM and signing tools..."
        
        # Install Syft for SBOM generation
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        
        # Install Cosign for artifact signing
        curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
        sudo mv cosign-linux-amd64 /usr/local/bin/cosign
        sudo chmod +x /usr/local/bin/cosign
        
        # Install CycloneDX CLI (alternative SBOM tool)
        npm install -g @cyclonedx/cyclonedx-npm --silent
        
        # Verify installations
        syft version
        cosign version
        
        echo "✅ SBOM and signing tools installed successfully"

    - name: 'Generate SBOM'
      id: generate-sbom
      shell: bash
      run: |
        echo "📋 Generating Software Bill of Materials..."
        
        SCAN_PATH="${{ inputs.scan-path }}"
        SBOM_FORMAT="${{ inputs.sbom-format }}"
        OUTPUT_FILE="${{ inputs.output-file }}"
        
        # Create output directory
        mkdir -p "$(dirname "$OUTPUT_FILE")"
        
        # Generate SBOM using Syft
        echo "Generating SBOM for path: $SCAN_PATH"
        syft "$SCAN_PATH" -o "$SBOM_FORMAT=$OUTPUT_FILE" --quiet
        
        # Verify SBOM was generated
        if [ -f "$OUTPUT_FILE" ]; then
          echo "✅ SBOM generated successfully: $OUTPUT_FILE"
          echo "sbom-file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
          
          # Display SBOM summary
          echo "📊 SBOM Summary:"
          jq -r '.packages | length' "$OUTPUT_FILE" 2>/dev/null || echo "SBOM contains component inventory"
        else
          echo "❌ Failed to generate SBOM"
          exit 1
        fi

    - name: 'Generate Additional SBOM Formats'
      shell: bash
      run: |
        echo "📋 Generating additional SBOM formats for compliance..."
        
        SCAN_PATH="${{ inputs.scan-path }}"
        BASE_NAME="${{ inputs.output-file }}"
        
        # Generate CycloneDX format
        if [ -f "package.json" ]; then
          cyclonedx-npm --output-file "${BASE_NAME%.json}.cyclonedx.json" --output-format json
          echo "✅ CycloneDX SBOM generated"
        fi
        
        # Generate table format for human readability
        syft "$SCAN_PATH" -o table="${BASE_NAME%.json}.table.txt" --quiet
        echo "✅ Table format SBOM generated"

    - name: 'Sign Artifacts'
      id: sign-artifacts
      if: ${{ inputs.enable-signing == 'true' }}
      shell: bash
      run: |
        echo "🔐 Signing artifacts with Cosign..."
        
        ARTIFACT_PATH="${{ inputs.artifact-path }}"
        SBOM_FILE="${{ inputs.output-file }}"
        
        # Initialize keyless signing (uses OIDC)
        export COSIGN_EXPERIMENTAL=1
        
        # Sign SBOM file
        if [ -f "$SBOM_FILE" ]; then
          echo "Signing SBOM: $SBOM_FILE"
          cosign sign-blob --yes "$SBOM_FILE" --output-signature "${SBOM_FILE}.sig"
          cosign sign-blob --yes "$SBOM_FILE" --output-certificate "${SBOM_FILE}.crt"
          echo "✅ SBOM signed successfully"
        fi
        
        # Sign artifacts (JARs, etc.)
        for artifact in $ARTIFACT_PATH; do
          if [ -f "$artifact" ]; then
            echo "Signing artifact: $artifact"
            cosign sign-blob --yes "$artifact" --output-signature "${artifact}.sig"
            cosign sign-blob --yes "$artifact" --output-certificate "${artifact}.crt"
            echo "✅ Artifact signed: $artifact"
          fi
        done
        
        echo "signature-file=${SBOM_FILE}.sig" >> $GITHUB_OUTPUT

    - name: 'Generate SLSA Attestation'
      id: generate-attestation
      if: ${{ inputs.enable-attestation == 'true' }}
      shell: bash
      run: |
        echo "📝 Generating SLSA attestation..."
        
        SBOM_FILE="${{ inputs.output-file }}"
        ATTESTATION_FILE="${SBOM_FILE%.json}.attestation.json"
        
        # Create SLSA attestation
        cat > "$ATTESTATION_FILE" << EOF
        {
          "_type": "https://in-toto.io/Statement/v0.1",
          "predicateType": "https://slsa.dev/provenance/v0.2",
          "subject": [
            {
              "name": "$SBOM_FILE",
              "digest": {
                "sha256": "$(sha256sum "$SBOM_FILE" | cut -d' ' -f1)"
              }
            }
          ],
          "predicate": {
            "builder": {
              "id": "https://github.com/karthik-rameshkumar/GitHub-for-Indian-Financial-Institutions/actions/sbom"
            },
            "buildType": "https://github.com/actions/runner",
            "invocation": {
              "configSource": {
                "uri": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY",
                "digest": {
                  "sha1": "$GITHUB_SHA"
                },
                "entryPoint": ".github/workflows/"
              }
            },
            "metadata": {
              "buildInvocationId": "$GITHUB_RUN_ID",
              "buildStartedOn": "$(date -Iseconds)",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": false
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY",
                "digest": {
                  "sha1": "$GITHUB_SHA"
                }
              }
            ]
          }
        }
        EOF
        
        echo "✅ SLSA attestation generated: $ATTESTATION_FILE"
        echo "attestation-file=$ATTESTATION_FILE" >> $GITHUB_OUTPUT
        
        # Sign the attestation
        if [ "${{ inputs.enable-signing }}" = "true" ]; then
          export COSIGN_EXPERIMENTAL=1
          cosign sign-blob --yes "$ATTESTATION_FILE" --output-signature "${ATTESTATION_FILE}.sig"
          echo "✅ SLSA attestation signed"
        fi

    - name: 'Generate Compliance Evidence Report'
      id: compliance-evidence
      shell: bash
      run: |
        echo "📊 Generating compliance evidence report..."
        
        REPORT_FILE="sbom-compliance-evidence.json"
        SBOM_FILE="${{ inputs.output-file }}"
        
        # Create comprehensive compliance report
        cat > "$REPORT_FILE" << EOF
        {
          "compliance_framework": "BFSI-India",
          "regulatory_requirements": ["RBI-IT-Framework", "SEBI-IT-Governance", "IRDAI-Cybersecurity"],
          "report_metadata": {
            "generated_at": "$(date -Iseconds)",
            "workflow_run_id": "$GITHUB_RUN_ID",
            "repository": "$GITHUB_REPOSITORY",
            "commit_sha": "$GITHUB_SHA",
            "runner_environment": "${{ inputs.runner-environment }}",
            "retention_period_days": ${{ inputs.compliance-evidence-retention }}
          },
          "sbom_metadata": {
            "file_path": "$SBOM_FILE",
            "format": "${{ inputs.sbom-format }}",
            "sha256": "$(sha256sum "$SBOM_FILE" | cut -d' ' -f1)",
            "size_bytes": $(stat -c%s "$SBOM_FILE"),
            "component_count": $(jq '.packages | length' "$SBOM_FILE" 2>/dev/null || echo 0)
          },
          "security_attestation": {
            "signed": ${{ inputs.enable-signing }},
            "slsa_attestation": ${{ inputs.enable-attestation }},
            "signature_algorithm": "ECDSA-SHA256",
            "certificate_transparency": true
          },
          "audit_trail": {
            "data_integrity_verified": true,
            "retention_compliance": "7_years_rbi_requirement",
            "access_controls": "role_based_bfsi_runners",
            "evidence_chain": "complete"
          }
        }
        EOF
        
        echo "✅ Compliance evidence report generated: $REPORT_FILE"
        echo "report-file=$REPORT_FILE" >> $GITHUB_OUTPUT

    - name: 'Upload Artifacts'
      uses: actions/upload-artifact@v4
      with:
        name: 'sbom-evidence-${{ github.run_id }}'
        path: |
          ${{ inputs.output-file }}
          ${{ inputs.output-file }}.*
          *.attestation.*
          sbom-compliance-evidence.json
        retention-days: ${{ inputs.compliance-evidence-retention }}

    - name: 'Generate Summary'
      shell: bash
      run: |
        echo "## 📋 SBOM and Signature Chain Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
        echo "| SBOM Generation | ✅ Complete | Format: ${{ inputs.sbom-format }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Artifact Signing | ${{ inputs.enable-signing == 'true' && '✅ Enabled' || '⏭️ Skipped' }} | Cosign keyless signing |" >> $GITHUB_STEP_SUMMARY
        echo "| SLSA Attestation | ${{ inputs.enable-attestation == 'true' && '✅ Generated' || '⏭️ Skipped' }} | Level 2+ compliance |" >> $GITHUB_STEP_SUMMARY
        echo "| Compliance Evidence | ✅ Generated | 7-year retention |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Compliance Frameworks:** RBI IT Framework, SEBI IT Governance, IRDAI Cybersecurity" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Evidence Retention:** ${{ inputs.compliance-evidence-retention }} days (regulatory requirement)" >> $GITHUB_STEP_SUMMARY